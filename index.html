<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Макосям ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; position: relative;
        }
        .card {
            text-align: center; z-index: 10; background: rgba(255, 255, 255, 0.9);
            padding: 40px 20px; border-radius: 30px; box-shadow: 0 15px 35px rgba(251, 111, 146, 0.3);
            backdrop-filter: blur(10px); width: 440px; max-width: 90%; min-height: 350px;
            display: flex; flex-direction: column; justify-content: center; position: relative;
        }
        .game-screen, .love-screen { width: 100%; }
        .game-title { color: #ff477e; font-size: 1.8rem; margin-bottom: 40px; }
        
        /* Исправленный контейнер кнопок */
        .btn-container {
            display: flex; justify-content: center; align-items: center; 
            gap: 20px; min-height: 100px; position: relative;
        }
        .btn {
            padding: 15px 35px; font-size: 1.2rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; border: none; transition: 0.2s;
        }
        .btn-yes { background: linear-gradient(45deg, #ff477e, #ff7096); color: white; z-index: 5; }
        .btn-no { background-color: #eee; color: #666; position: absolute; left: 55%; z-index: 4; }

        .love-screen { display: none; opacity: 0; }
        .love-screen.show { display: block; opacity: 1; animation: fadeIn 0.8s; }
        
        .timer-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .timer-item { background: #fff0f3; padding: 10px 5px; border-radius: 12px; border: 1px solid #ffc2d1; }
        .timer-value { display: block; font-size: 1.4rem; font-weight: bold; color: #ff477e; }
        .timer-label { font-size: 0.7rem; color: #7a7a7a; }

        .typewriter-container { color: #4a4a4a; font-size: 1rem; line-height: 1.6; margin-top: 15px; min-height: 60px; }
        .kiss-btn { 
            display: none; margin: 20px auto 0; background: #ff7096; color: white; 
            padding: 12px 20px; border-radius: 50px; border: none; cursor: pointer;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .falling-heart { position: absolute; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { 0% { transform: translateY(-20px); opacity: 1; } 100% { transform: translateY(105vh); opacity: 0; } }
        @keyframes explode { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(var(--x), var(--y)); opacity: 0; } }
    </style>
</head>
<body onclick="spawnHearts(event)">

    <div class="card" id="mainCard" onclick="event.stopPropagation()">
        <div class="game-screen" id="gameScreen">
            <h2 class="game-title">Макосям, ты меня любишь? 🥺</h2>
            <div class="btn-container">
                <button class="btn btn-yes" onclick="revealLove()">ДА! ❤️</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveBtn()" onclick="moveBtn()">Нет 😢</button>
            </div>
        </div>

        <div class="love-screen" id="loveScreen">
            <h1 style="color: #ff477e;">Мы вместе уже:</h1>
            <div class="timer-container">
                <div class="timer-item"><span class="timer-value" id="d">0</span><span class="timer-label">Дней</span></div>
                <div class="timer-item"><span class="timer-value" id="h">0</span><span class="timer-label">Часов</span></div>
                <div class="timer-item"><span class="timer-value" id="m">0</span><span class="timer-label">Минут</span></div>
                <div class="timer-item"><span class="timer-value" id="s">0</span><span class="timer-label">Секунд</span></div>
            </div>
            <div class="typewriter-container" id="textTarget"></div>
            <button class="kiss-btn" id="kissBtn" onclick="sendKiss()">Отправить поцелуй 💋</button>
        </div>
    </div>

    <script>
        const start = new Date(2026, 1, 22); //
        const msg = "Иногда я могу не говорить это каждый день, но я правда ценю тебя и то, что ты есть в моей жизни. Просто хотел, чтобы ты это знала и не забывала. ❤️";

        function moveBtn() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * 70 - 35; // Ограничил разлет, чтобы не улетала за экран
            const y = Math.random() * 150 - 75;
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        function update() {
            const diff = new Date() - start;
            document.getElementById('d').innerText = Math.floor(diff / 864e5);
            document.getElementById('h').innerText = Math.floor((diff / 36e5) % 24);
            document.getElementById('m').innerText = Math.floor((diff / 6e4) % 60);
            document.getElementById('s').innerText = Math.floor((diff / 1e3) % 60);
        }

        function revealLove() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('loveScreen').classList.add('show');
            setInterval(update, 1000); update();
            setInterval(() => spawnHeart(), 300);
            let i = 0;
            const timer = setInterval(() => {
                if (i < msg.length) document.getElementById('textTarget').innerHTML += msg[i++];
                else { clearInterval(timer); document.getElementById('kissBtn').style.display = 'block'; }
            }, 50);
        }

        function spawnHeart() {
            const h = document.createElement('div');
            h.className = 'falling-heart'; h.innerText = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 20 + 15 + 'px';
            h.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }

        function spawnHearts(e) {
            for (let i = 0; i < 6; i++) {
                const h = document.createElement('div');
                h.innerText = '💖'; h.style.position = 'absolute';
                h.style.left = e.clientX + 'px'; h.style.top = e.clientY + 'px';
                const x = (Math.random() - 0.5) * 200 + 'px';
                const y = (Math.random() - 0.5) * 200 + 'px';
                h.style.setProperty('--x', x); h.style.setProperty('--y', y);
                h.style.animation = 'explode 0.6s forwards';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 600);
            }
        }

        function sendKiss() {
            const btn = document.getElementById('kissBtn');
            btn.innerText = "Поцелуй получен! ❤️";
            btn.style.background = "#4fca5d";
            for (let i = 0; i < 20; i++) setTimeout(() => spawnHearts({clientX: window.innerWidth/2, clientY: window.innerHeight/2}), i * 50);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Макосям ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Главная карточка */
        .card {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(251, 111, 146, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            max-width: 90%;
            width: 440px;
            transition: all 0.5s ease;
            position: relative;
        }

        /* Экран игры */
        .game-screen {
            display: block;
        }

        .game-title {
            color: #ff477e;
            font-size: 1.6rem;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        /* Контейнер для кнопок */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 60px;
            position: relative;
        }

        .btn {
            padding: 14px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            border: none;
            outline: none;
            transition: transform 0.2s;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff477e, #ff7096);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
        }

        .btn-yes:hover {
            transform: scale(1.1);
        }

        /* Убегающая кнопка */
        .btn-no {
            background-color: #f0f0f0;
            color: #666;
            position: absolute;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            user-select: none;
        }

        /* Экран со счетчиком и печатью текста */
        .love-screen {
            display: none;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .love-screen.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .heart-icon {
            font-size: 3.5rem;
            color: #ff477e;
            animation: heartbeat 1.2s infinite;
            margin-bottom: 10px;
        }

        h1 {
            color: #ff477e;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        /* Стили счетчика */
        .timer-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 25px 0;
        }

        .timer-item {
            background: #fff0f3;
            padding: 12px 5px;
            border-radius: 14px;
            border: 1px solid #ffc2d1;
        }

        .timer-value {
            display: block;
            font-size: 1.6rem;
            font-weight: bold;
            color: #ff477e;
        }

        .timer-label {
            font-size: 0.75rem;
            color: #7a7a7a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Контейнер для эффекта печатающегося текста */
        .typewriter-container {
            color: #4a4a4a;
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.6;
            min-height: 80px; /* Чтобы карточка не прыгала по высоте во время печати */
            text-align: center;
            margin-top: 20px;
        }

        /* Каретка (мигающий курсор) */
        .cursor {
            display: inline-block;
            width: 2px;
            background-color: #ff477e;
            margin-left: 2px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .falling-heart {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <!-- ЭКРАН 1: ИНТЕРАКТИВНАЯ ИГРА -->
        <div class="game-screen" id="gameScreen">
            <h2 class="game-title">Макосям, ты меня любишь? 🥺</h2>
            <div class="btn-container" id="btnContainer">
                <button class="btn btn-yes" onclick="revealLove()">ДА! ❤️</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Нет 😢</button>
            </div>
        </div>

        <!-- ЭКРАН 2: СЧЕТЧИК И ЭФФЕКТ ПЕЧАТИ -->
        <div class="love-screen" id="loveScreen">
            <div class="heart-icon">❤️</div>
            <h1>Мы вместе уже:</h1>
            
            <div class="timer-container">
                <div class="timer-item">
                    <span class="timer-value" id="days">0</span>
                    <span class="timer-label">Дней</span>
                </div>
                <div class="timer-item">
                    <span class="timer-value" id="hours">0</span>
                    <span class="timer-label">Часов</span>
                </div>
                <div class="timer-item">
                    <span class="timer-value" id="minutes">0</span>
                    <span class="timer-label">Минут</span>
                </div>
                <div class="timer-item">
                    <span class="timer-value" id="seconds">0</span>
                    <span class="timer-label">Секунд</span>
                </div>
            </div>

            <!-- Сюда скрипт будет по букве выводить твой текст -->
            <div class="typewriter-container">
                <span id="textTarget"></span><span class="cursor" id="textCursor">|</span>
            </div>
        </div>
    </div>

    <script>
        // Дата начала отношений: 22 февраля 2026 (февраль — это 1)
        const startDate = new Date(2026, 1, 22, 0, 0, 0);

        // Твой текст для эффекта печатной машинки
        const messageText = "Иногда я могу не говорить это каждый день, но я правда ценю тебя и то, что ты есть в моей жизни. Просто хотел, чтобы ты это знала и не забывала. ❤️";

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const card = document.getElementById('mainCard');
            
            const cardWidth = card.clientWidth;
            const cardHeight = card.clientHeight;
            
            const randomX = Math.floor(Math.random() * (cardWidth - noBtn.clientWidth - 40)) + 20;
            const randomY = Math.floor(Math.random() * (cardHeight - noBtn.clientHeight - 40)) + 20;
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }

        function typeWriter(text, i, targetId, callback) {
            if (i < text.length) {
                document.getElementById(targetId).innerHTML += text.charAt(i);
                setTimeout(function() {
                    typeWriter(text, i + 1, targetId, callback);
                }, 50); // Скорость печати (50 мс на одну букву)
            } else if (callback) {
                callback();
            }
        }

        function revealLove() {
            document.getElementById('gameScreen').style.display = 'none';
            
            const loveScreen = document.getElementById('loveScreen');
            loveScreen.classList.add('show');
            
            setInterval(updateTimer, 1000);
            updateTimer();
            
            setInterval(createHeart, 300);
            for(let i = 0; i < 15; i++) {
                setTimeout(createHeart, i * 40);
            }

            // Запуск эффекта печати текста через полсекунды после открытия экрана
            setTimeout(function() {
                typeWriter(messageText, 0, 'textTarget', function() {
                    // Когда текст полностью напечатается, скрываем мигающую палочку-курсор
                    document.getElementById('textCursor').style.display = 'none';
                });
            }, 600);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            
            const heartTypes = ['❤️', '💖', '💝', '💕', '💗'];
            heart.innerText = heartTypes[Math.floor(Math.random() * heartTypes.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 20 + 15;
            heart.style.fontSize = size + 'px';
            
            const duration = Math.random() * 3 + 2;
            heart.style.animationDuration = duration + 's';
            heart.style.opacity = Math.random() * 0.4 + 0.6;
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        window.onload = function() {
            const noBtn = document.getElementById('noBtn');
            noBtn.style.right = '40px';
            noBtn.style.top = '138px';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для Макосям ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            overflow-x: hidden; position: relative; padding: 20px 10px;
        }

        /* Нежный живой фон */
        .background-glow {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; overflow: hidden; pointer-events: none;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(50px); opacity: 0.6; animation: float 12s infinite alternate ease-in-out;
        }
        .blob1 { width: 280px; height: 280px; background: #fff0f3; top: -5%; left: 10%; animation-duration: 14s; }
        .blob2 { width: 320px; height: 320px; background: #ffb3c6; bottom: -5%; right: 5%; animation-duration: 16s; }
        .blob3 { width: 220px; height: 220px; background: #ff85a2; top: 35%; left: 60%; animation-duration: 11s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 20px) scale(1.1); }
        }

        /* Адаптивная матовая карточка */
        .card {
            text-align: center; z-index: 10; 
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 35px 20px; border-radius: 30px; 
            box-shadow: 0 20px 45px rgba(251, 111, 146, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.3);
            width: 100%; max-width: 400px; min-height: 420px;
            display: flex; flex-direction: column; justify-content: center; position: relative;
        }

        .game-screen, .love-screen { width: 100%; }
        .game-title { color: #ff477e; font-size: 1.7rem; margin-bottom: 35px; font-weight: bold; padding: 0 10px; }
        
        /* Кнопки */
        .btn-container {
            display: flex; justify-content: space-around; align-items: center; 
            min-height: 100px; position: relative; width: 100%;
        }
        .btn {
            padding: 15px 35px; font-size: 1.15rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; border: none; outline: none;
        }
        .btn-yes { 
            background: linear-gradient(45deg, #ff477e, #ff7096); color: white; 
            box-shadow: 0 5px 20px rgba(255, 71, 126, 0.3); transition: transform 0.2s;
        }
        .btn-yes:active { transform: scale(0.95); }
        
        .btn-no { 
            background: rgba(255, 255, 255, 0.6); color: #ff7096; border: 1px solid rgba(255, 255, 255, 0.7);
            transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); user-select: none;
        }

        /* Экран контента */
        .love-screen { display: none; opacity: 0; }
        .love-screen.show { display: flex; flex-direction: column; align-items: center; opacity: 1; animation: fadeIn 0.8s ease-out; }
        
        /* Стеклянные плашки таймера */
        .timer-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 20px 0; width: 100%; }
        .timer-item { 
            background: rgba(255, 255, 255, 0.5); padding: 10px 2px; border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .timer-value { display: block; font-size: 1.45rem; font-weight: bold; color: #ff477e; }
        .timer-label { font-size: 0.7rem; color: #7a7a7a; font-weight: 500; }

        .typewriter-container { color: #4a4a4a; font-size: 1rem; line-height: 1.5; margin-top: 10px; min-height: 70px; font-weight: 500; text-align: center; }
        
        /* Секция комплиментов */
        .compliment-box {
            width: 100%; margin: 15px 0 5px; min-height: 65px;
            background: rgba(255, 255, 255, 0.3); border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4); padding: 12px;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: scale(0.95); transition: opacity 0.3s, transform 0.3s;
        }
        .compliment-box.reveal { opacity: 1; transform: scale(1); }
        .compliment-text { color: #ff3366; font-size: 0.95rem; font-weight: 600; line-height: 1.4; }

        /* Функциональные кнопки внизу */
        .action-btn { 
            display: none; width: 100%; margin-top: 12px; color: white; 
            padding: 14px 20px; border-radius: 50px; border: none; cursor: pointer; font-size: 1rem; font-weight: bold;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .action-btn:active { transform: scale(0.98); }
        
        #kissBtn { background: linear-gradient(45deg, #ff7096, #ff85a2); box-shadow: 0 5px 15px rgba(255, 112, 150, 0.3); }
        #kissBtn.success { background: #4fca5d !important; box-shadow: 0 5px 15px rgba(79, 202, 93, 0.3); cursor: default; }
        
        #complimentBtn { background: linear-gradient(45deg, #ff477e, #ff7096); box-shadow: 0 5px 15px rgba(255, 71, 126, 0.3); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .falling-heart { position: absolute; pointer-events: none; z-index: 1; animation: fall linear forwards; }
        @keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(360deg); opacity: 0; } }
        
        /* Эффект мощного взрыва во все стороны */
        @keyframes explode { 
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; } 
            80% { opacity: 0.9; }
            100% { transform: translate(var(--x), var(--y)) scale(1.2); opacity: 0; } 
        }
    </style>
</head>
<body onclick="spawnHearts(event)">

    <div class="background-glow">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <div class="card" id="mainCard" onclick="event.stopPropagation()">
        <!-- ЭКРАН 1: ИГРА -->
        <div class="game-screen" id="gameScreen">
            <h2 class="game-title">Макосям, ты меня любишь? 🥺</h2>
            <div class="btn-container">
                <button class="btn btn-yes" onclick="revealLove()">ДА! ❤️</button>
                <button class="btn btn-no" id="noBtn" ontouchstart="moveBtn(event)" onmouseover="moveBtn(event)" onclick="moveBtn(event)">Нет 😢</button>
            </div>
        </div>

        <!-- ЭКРАН 2: ТАЙМЕР, СЛОВА И ИНТЕРАКТИВ -->
        <div class="love-screen" id="loveScreen">
            <div style="font-size: 2.5rem; color: #ff477e; margin-bottom: 5px;">❤️</div>
            <h1 style="color: #ff477e; font-size: 1.5rem; margin-bottom: 2px;">Мы вместе уже:</h1>
            
            <div class="timer-container">
                <div class="timer-item"><span class="timer-value" id="d">0</span><span class="timer-label">Дней</span></div>
                <div class="timer-item"><span class="timer-value" id="h">0</span><span class="timer-label">Часов</span></div>
                <div class="timer-item"><span class="timer-value" id="m">0</span><span class="timer-label">Минут</span></div>
                <div class="timer-item"><span class="timer-value" id="s">0</span><span class="timer-label">Секунд</span></div>
            </div>
            
            <div class="typewriter-container" id="textTarget"></div>
            
            <!-- Окно вывода комплиментов -->
            <div class="compliment-box" id="compBox">
                <span class="compliment-text" id="compText">Нажми на кнопку ниже ✨</span>
            </div>

            <!-- Кнопки действий -->
            <button class="action-btn" id="kissBtn" onclick="sendKiss()">Отправить поцелуй 💋</button>
            <button class="action-btn" id="complimentBtn" onclick="generateCompliment()">Получить комплимент ✨</button>
        </div>
    </div>

    <script>
        const start = new Date(2026, 1, 22); 
        const msg = "Иногда я могу не говорить это каждый день, но я правда ценю тебя и то, что ты есть в моей жизни. Просто хотел, чтобы ты это знала и не забывала. ❤️";

        const compliments = [
            "Твоя улыбка — это лучшее, что я вижу за весь день. 😊",
            "У тебя невероятно красивые глаза, в которых можно утонуть. 👀❤️",
            "Ты умеешь поднимать мне настроение, даже когда всё идёт наперекосяк. 🌟",
            "Я обожаю твой смех, он самый искренний и заразительный. ✨",
            "Ты сочетаешь в себе невероятную красоту, ум и доброту. 🌸",
            "Рядом с тобой я чувствую себя по-настоящему счастливым. 🥰",
            "Твой голос действует на меня как самое лучшее успокоительное. 🎵",
            "Ты уникальная, и другой такой на всём свете точно нет! 💎",
            "Мне безумно нравится твоё чувство юмора и то, как мы понимаем друг друга. 🤝",
            "Ты вдохновляешь меня становиться лучше каждый божий день. 🚀",
            "У тебя удивительная энергетика, к тебе всегда хочется быть ближе. 🔋❤️",
            "Ты бы знала, как сильно украшаешь мою жизнь своим присутствием. 👑",
            "Твои объятия — самое уютное и безопасное место на земле. 🧸",
            "Ты невероятно стильная, у тебя безупречный вкус во всём. 👑✨",
            "Я ценю твою заботу и то, как сильно ты меня поддерживаешь. Спасибо тебе. 💖"
        ];

        let lastComplimentIndex = -1;

        function moveBtn(e) {
            if (e) e.preventDefault();
            const btn = document.getElementById('noBtn');
            const randomX = (Math.random() - 0.5) * 150; 
            const randomY = (Math.random() - 0.5) * 90; 
            
            const safeX = Math.abs(randomX) < 35 ? (randomX < 0 ? -50 : 50) : randomX;
            const safeY = Math.abs(randomY) < 25 ? (randomY < 0 ? -40 : 40) : randomY;
            
            btn.style.transform = `translate(${safeX}px, ${safeY}px)`;
        }

        function update() {
            const diff = new Date() - start;
            document.getElementById('d').innerText = Math.floor(diff / 864e5);
            document.getElementById('h').innerText = Math.floor((diff / 36e5) % 24);
            document.getElementById('m').innerText = Math.floor((diff / 6e4) % 60);
            document.getElementById('s').innerText = Math.floor((diff / 1e3) % 60);
        }

        function revealLove() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('loveScreen').classList.add('show');
            setInterval(update, 1000); update();
            setInterval(() => spawnHeart(), 300);
            let i = 0;
            const timer = setInterval(() => {
                if (i < msg.length) document.getElementById('textTarget').innerHTML += msg[i++];
                else { 
                    clearInterval(timer); 
                    document.getElementById('kissBtn').style.display = 'block'; 
                    document.getElementById('complimentBtn').style.display = 'block'; 
                }
            }, 45);
        }

        function generateCompliment() {
            const box = document.getElementById('compBox');
            const text = document.getElementById('compText');
            box.classList.remove('reveal');
            setTimeout(() => {
                let randomIndex;
                document.getElementById('mainCard').style.transform = 'scale(1.02)';
                setTimeout(() => document.getElementById('mainCard').style.transform = 'scale(1)', 150);
                do {
                    randomIndex = Math.floor(Math.random() * compliments.length);
                } while (randomIndex === lastComplimentIndex);
                lastComplimentIndex = randomIndex;
                text.innerText = compliments[randomIndex];
                box.classList.add('reveal');
            }, 250);
        }

        function spawnHeart() {
            const h = document.createElement('div');
            h.className = 'falling-heart'; h.innerText = ['❤️', '💖', '💝', '💕', '💗'][Math.floor(Math.random() * 5)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 15 + 15 + 'px';
            h.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 4000);
        }

        // Универсальная функция взрыва, работающая по любым координатам X и Y
        function triggerExplosion(centerX, centerY, count = 8, spread = 160) {
            const icons = ['❤️', '💖', '💋', '💕', '🌸', '✨'];
            for (let i = 0; i < count; i++) {
                const h = document.createElement('div');
                h.innerText = icons[Math.floor(Math.random() * icons.length)]; 
                h.style.position = 'absolute'; h.style.zIndex = '99';
                h.style.left = centerX + 'px'; h.style.top = centerY + 'px';
                h.style.fontSize = Math.random() * 10 + 20 + 'px'; // Сердечки стали чуть крупнее и заметнее
                
                // Рассчитываем случайный разлет во все стороны от центра
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * spread + 40;
                const x = Math.cos(angle) * distance + 'px';
                const y = Math.sin(angle) * distance + 'px';
                
                h.style.setProperty('--x', x); h.style.setProperty('--y', y);
                h.style.animation = 'explode 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) forwards';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 700);
            }
        }

        // Взрыв по клику пальцем на фон
        function spawnHearts(e) {
            triggerExplosion(e.clientX, e.clientY, 6, 120);
        }

        // Мощный залп ровно по центру экрана
        function sendKiss() {
            const btn = document.getElementById('kissBtn');
            if (btn.classList.contains('success')) return;
            
            btn.classList.add('success');
            btn.innerText = "Поцелуй получеен! Суйемгой сизди ❤️";
            
            const midX = window.innerWidth / 2;
            const midY = window.innerHeight / 2;
            
            // Запускаем каскад взрывов прямо по центру экрана с небольшим интервалом
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    triggerExplosion(midX, midY, 15, 250); // 15 сердечек за один бах, разлет шире!
                }, i * 150);
            }
        }
    </script>
</body>
</html>

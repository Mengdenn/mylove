<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Макосям ❤️ (Light Glass Edition)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%); /* Твой любимый розоватый градиент */
            font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; position: relative;
            cursor: pointer;
        }

        /* Светлые плавающие зефирные шары на фоне */
        .background-glow {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; overflow: hidden;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(50px); opacity: 0.7; animation: float 12s infinite alternate ease-in-out;
        }
        .blob1 { width: 320px; height: 320px; background: #fff0f3; top: -5%; left: 15%; animation-duration: 14s; }
        .blob2 { width: 380px; height: 380px; background: #ffb3c6; bottom: -5%; right: 10%; animation-duration: 16s; }
        .blob3 { width: 260px; height: 260px; background: #ff85a2; top: 35%; left: 65%; animation-duration: 11s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        /* Эффект светлого матового стекла */
        .card {
            text-align: center; z-index: 10; 
            background: rgba(255, 255, 255, 0.45); /* Более прозрачное и светлое стекло */
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 45px 25px; border-radius: 30px; 
            box-shadow: 0 20px 45px rgba(251, 111, 146, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.3);
            width: 440px; max-width: 90%; min-height: 400px;
            display: flex; flex-direction: column; justify-content: center; position: relative;
            cursor: default; transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            box-shadow: 0 25px 50px rgba(251, 111, 146, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .game-screen, .love-screen { width: 100%; }
        .game-title { color: #ff477e; font-size: 1.85rem; margin-bottom: 40px; font-weight: bold; }
        
        /* Кнопки */
        .btn-container {
            display: flex; justify-content: space-around; align-items: center; 
            min-height: 120px; position: relative; width: 100%;
        }
        .btn {
            padding: 16px 38px; font-size: 1.2rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; border: none; outline: none; box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }
        .btn-yes { 
            background: linear-gradient(45deg, #ff477e, #ff7096); color: white; 
            box-shadow: 0 5px 20px rgba(255, 71, 126, 0.4); transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-yes:hover { transform: scale(1.08); box-shadow: 0 5px 25px rgba(255, 71, 126, 0.6); }
        
        .btn-no { 
            background: rgba(255, 255, 255, 0.6); color: #ff7096; border: 1px solid rgba(255, 255, 255, 0.7);
            transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); user-select: none;
        }

        /* Экран контента */
        .love-screen { display: none; opacity: 0; }
        .love-screen.show { display: block; opacity: 1; animation: fadeIn 0.8s ease-out; }
        
        /* Розоватые стеклянные плашки таймера */
        .timer-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 25px 0; }
        .timer-item { 
            background: rgba(255, 255, 255, 0.5); padding: 12px 5px; border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 10px rgba(251, 111, 146, 0.05);
        }
        .timer-value { display: block; font-size: 1.6rem; font-weight: bold; color: #ff477e; }
        .timer-label { font-size: 0.75rem; color: #7a7a7a; font-weight: 500; }

        .typewriter-container { color: #4a4a4a; font-size: 1.05rem; line-height: 1.6; margin-top: 15px; min-height: 80px; font-weight: 500; }
        
        .kiss-btn { 
            display: none; margin: 25px auto 0; background: linear-gradient(45deg, #ff7096, #ff85a2); color: white; 
            padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; font-size: 1.05rem; font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 112, 150, 0.3);
        }
        .kiss-btn.success { background: #4fca5d !important; box-shadow: 0 5px 15px rgba(79, 202, 93, 0.4); cursor: default; }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .falling-heart { position: absolute; pointer-events: none; z-index: 1; animation: fall linear forwards; }
        @keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(360deg); opacity: 0; } }
        @keyframes explode { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(0.4); opacity: 0; } }
    </style>
</head>
<body onclick="spawnHearts(event)">

    <!-- Нежный живой фон -->
    <div class="background-glow">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <!-- Матовая карточка -->
    <div class="card" id="mainCard" onclick="event.stopPropagation()">
        <!-- ЭКРАН 1: ИГРА -->
        <div class="game-screen" id="gameScreen">
            <h2 class="game-title">Макосям, ты меня любишь? 🥺</h2>
            <div class="btn-container">
                <button class="btn btn-yes" onclick="revealLove()">ДА! ❤️</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveBtn()" onclick="moveBtn()">Нет 😢</button>
            </div>
        </div>

        <!-- ЭКРАН 2: ТАЙМЕР И СЛОВА -->
        <div class="love-screen" id="loveScreen">
            <div style="font-size: 3.2rem; color: #ff477e; margin-bottom: 10px;">❤️</div>
            <h1 style="color: #ff477e; font-size: 1.8rem; margin-bottom: 5px;">Мы вместе уже:</h1>
            <div class="timer-container">
                <div class="timer-item"><span class="timer-value" id="d">0</span><span class="timer-label">Дней</span></div>
                <div class="timer-item"><span class="timer-value" id="h">0</span><span class="timer-label">Часов</span></div>
                <div class="timer-item"><span class="timer-value" id="m">0</span><span class="timer-label">Минут</span></div>
                <div class="timer-item"><span class="timer-value" id="s">0</span><span class="timer-label">Секунд</span></div>
            </div>
            <div class="typewriter-container" id="textTarget"></div>
            <button class="kiss-btn" id="kissBtn" onclick="sendKiss()">Отправить виртуальный поцелуй 💋</button>
        </div>
    </div>

    <script>
        const start = new Date(2026, 1, 22); // 22 февраля 2026 года
        const msg = "Иногда я могу не говорить это каждый день, но я правда ценю тебя и то, что ты есть в моей жизни. Просто хотел, чтобы ты это знала и не забывала. ❤️";

        function moveBtn() {
            const btn = document.getElementById('noBtn');
            const randomX = (Math.random() - 0.5) * 160; 
            const randomY = (Math.random() - 0.5) * 100; 
            
            const safeX = Math.abs(randomX) < 40 ? (randomX < 0 ? -60 : 60) : randomX;
            const safeY = Math.abs(randomY) < 30 ? (randomY < 0 ? -50 : 50) : randomY;
            
            btn.style.transform = `translate(${safeX}px, ${safeY}px)`;
        }

        function update() {
            const diff = new Date() - start;
            document.getElementById('d').innerText = Math.floor(diff / 864e5);
            document.getElementById('h').innerText = Math.floor((diff / 36e5) % 24);
            document.getElementById('m').innerText = Math.floor((diff / 6e4) % 60);
            document.getElementById('s').innerText = Math.floor((diff / 1e3) % 60);
        }

        function revealLove() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('loveScreen').classList.add('show');
            setInterval(update, 1000); update();
            setInterval(() => spawnHeart(), 250);
            let i = 0;
            const timer = setInterval(() => {
                if (i < msg.length) document.getElementById('textTarget').innerHTML += msg[i++];
                else { clearInterval(timer); document.getElementById('kissBtn').style.display = 'block'; }
            }, 50);
        }

        function spawnHeart() {
            const h = document.createElement('div');
            h.className = 'falling-heart'; h.innerText = ['❤️', '💖', '💝', '💕', '💗'][Math.floor(Math.random() * 5)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 20 + 15 + 'px';
            h.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 4000);
        }

        function spawnHearts(e) {
            const icons = ['❤️', '💖', '💋', '💕'];
            for (let i = 0; i < 7; i++) {
                const h = document.createElement('div');
                h.innerText = icons[Math.floor(Math.random() * icons.length)]; 
                h.style.position = 'absolute'; h.style.zIndex = '5';
                h.style.left = e.clientX + 'px'; h.style.top = e.clientY + 'px';
                const x = (Math.random() - 0.5) * 160 + 'px';
                const y = (Math.random() - 0.5) * 160 + 'px';
                h.style.setProperty('--x', x); h.style.setProperty('--y', y);
                h.style.animation = 'explode 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 600);
            }
        }

        function sendKiss() {
            const btn = document.getElementById('kissBtn');
            if (btn.classList.contains('success')) return;
            
            btn.classList.add('success');
            btn.innerText = "Поцелуй получен! Люблю тебя ❤️";
            
            for (let i = 0; i < 25; i++) {
                setTimeout(() => spawnHearts({clientX: window.innerWidth/2, clientY: window.innerHeight/2}), i * 40);
            }
        }
    </script>
</body>
</html>
